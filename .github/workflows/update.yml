name: Daily Auto Doorway & Keyword Scraper

on:
  schedule:
    - cron: '0 8 * * *' # Автозапуск каждый день в 08:00 UTC
  workflow_dispatch: # Возможность запустить вручную кнопкой

jobs:
  update-site:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Права на запись страниц и ключей в репозиторий
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run keyword scraper & generator
        run: node update.js

      - name: Commit and push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.dev"
          git add .
          git commit -m "Auto-scraped new keywords and updated site [skip ci]" || exit 0
          git push
          
