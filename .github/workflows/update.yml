name: Daily Auto Deep Doorway & Keywords

on:
  schedule:
    - cron: '0 8 * * *' # Автозапуск каждый день в 08:00 UTC
  workflow_dispatch: # Ручная кнопка запуска в GitHub Actions

jobs:
  update-site:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Права на сохранение новых ключей и страниц в репозиторий
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run deep keyword collector (НЧ парсер)
        run: node collect_keywords.js

      - name: Run site and sitemap generator
        run: node update.js

      - name: Commit and push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.dev"
          git add .
          git commit -m "Auto-collected deep keywords and updated doorway [skip ci]" || exit 0
          git push
